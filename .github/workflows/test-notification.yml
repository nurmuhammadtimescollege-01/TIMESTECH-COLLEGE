
name: Test Student Notification

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send test notification to 3 students
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          node <<'NODE'
          async function main() {
            const subscriptionIds = [
              "7c278911-e370-4a07-a208-397f9d7fd6f9",
              "95f5fac3-3af9-4b13-b59a-743f6896efe8",
              "643a4ede-79da-4eba-a7de-b193a90eb7d7"
            ];

            const response = await fetch(
              "https://api.onesignal.com/notifications",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Key ${process.env.ONESIGNAL_API_KEY}`
                },
                body: JSON.stringify({
                  app_id: "e2411621-eb73-480b-96f6-a79bfbea0a69",
                  include_subscription_ids: subscriptionIds,
                  headings: {
                    en: "TimesTech College"
                  },
                  contents: {
                    en: "Ujian notifikasi berjaya! Ini ujian untuk pelajar 0001, 0004 dan 0007."
                  },
                  web_url: "https://nurmuhammadtimescollege-01.github.io/TIMESTECH-COLLEGE/student.html"
                })
              }
            );

            const result = await response.json();
            console.log("OneSignal response:", result);

            if (!response.ok || result.errors) {
              throw new Error(JSON.stringify(result));
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
