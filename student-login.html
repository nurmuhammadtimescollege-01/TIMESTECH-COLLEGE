<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Area | TimesTech College</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #eef5ff,
                #ffffff
            );

            color: #102d5f;
        }

        .login-container {
            width: 100%;
            max-width: 460px;

            padding: 20px;
        }

        .login-card {
            background: #ffffff;

            padding: 45px 40px;

            border-radius: 24px;

            text-align: center;

            border: 1px solid #e1e9f5;

            box-shadow:
                0 20px 50px rgba(30, 70, 130, 0.12);
        }

        .logo {
            width: 85px;
            height: 85px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(
                145deg,
                #1764df,
                #1646a3
            );

            color: white;

            font-size: 34px;

            box-shadow:
                0 10px 25px rgba(23, 100, 223, 0.25);
        }

        .login-card h1 {
            font-size: 30px;

            margin-bottom: 10px;

            color: #102d5f;
        }

        .login-card .subtitle {
            color: #667085;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .input-label {
            display: block;

            text-align: left;

            font-size: 13px;

            font-weight: 700;

            color: #344054;

            margin-bottom: 8px;
        }

        .code-input {
            width: 100%;

            padding: 15px 16px;

            border: 1px solid #d0d9e8;

            border-radius: 12px;

            font-size: 15px;

            outline: none;

            text-align: center;

            letter-spacing: 1px;

            transition: 0.3s;
        }

        .code-input:focus {
            border-color: #1764df;

            box-shadow:
                0 0 0 4px rgba(23, 100, 223, 0.10);
        }

        .login-button {
            width: 100%;

            margin-top: 18px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #1764df,
                #1646a3
            );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(23, 100, 223, 0.25);
        }

        .message {
            min-height: 24px;

            margin-top: 18px;

            font-size: 14px;

            font-weight: 600;
        }

        .back-home {
            display: inline-block;

            margin-top: 25px;

            color: #1764df;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #e8eef7;

            color: #8a94a6;

            font-size: 12px;

            line-height: 1.5;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 35px 25px;
            }

            .login-card h1 {
                font-size: 26px;
            }

        }
    </style>
    
<script type="module">
    import { initializeApp } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDbmmHXlulqgUxqzbn7iGeywHMdEraDO2Y",
        authDomain: "student-area-2dd83.firebaseapp.com",
        projectId: "student-area-2dd83",
        storageBucket: "student-area-2dd83.firebasestorage.app",
        messagingSenderId: "601486438219",
        appId: "1:601486438219:web:ac9e234cc153b9cd59c2ce"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.studentFirebaseLogin = async function(studentId, password) {
        const email = `student${studentId}@timesttechcollege.com`;

        return signInWithEmailAndPassword(auth, email, password);
    };
</script>

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🔐
            </div>

            <h1>Student Area</h1>

            <p class="subtitle">
                Welcome to TimesTech College Student Area.
                Please enter your student access code to continue.
            </p>

            <label class="input-label" for="studentCode">
                Student Access Code
            </label>

            <input
                type="text"
                id="studentCode"
                class="code-input"
                placeholder="2026-0001-DPRK"
                autocomplete="off"
            >
            
<label class="input-label" for="studentPassword">
    Password
</label>

<input
    type="password"
    id="studentPassword"
    class="code-input"
    placeholder="Enter your password"
    autocomplete="current-password"
>


            <button
                class="login-button"
                onclick="checkStudentCode()">
                Access Student Area →
            </button>

            <div
                id="message"
                class="message">
            </div>

            <a
                href="index.html"
                class="back-home">
                ← Back to Home
            </a>

            <div class="security-note">
                🔒 This area is restricted to registered
                TimesTech College students.
            </div>

        </div>

    </div>


    <script>

        
async function checkStudentCode() {
    const studentId = document
        .getElementById("studentCode")
        .value
        .trim();

    const password = document
        .getElementById("studentPassword")
        .value;

    const message = document.getElementById("message");

    if (!/^\d{4}$/.test(studentId)) {
        message.style.color = "#dc2626";
        message.textContent = "Masukkan ID pelajar 4 digit.";
        return;
    }

    if (!password) {
        message.style.color = "#dc2626";
        message.textContent = "Masukkan password.";
        return;
    }

    message.style.color = "#2563eb";
    message.textContent = "Sedang log masuk...";

    try {
        await window.studentFirebaseLogin(studentId, password);

        message.style.color = "#15803d";
        message.textContent = "Login berjaya!";

        window.location.href =
            "student.html?student=" +
            encodeURIComponent(studentId);
    } catch (error) {
        console.error(error);
        message.style.color = "#dc2626";
        message.textContent =
            "ID atau password salah. Cuba lagi.";
    }
}


        document
            .getElementById("studentCode")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    checkStudentCode();

                }

            });

    </script>

</body>

</html>
